[executor]
n_threads: 4
TPS: 100
emit_queue_stats: no
signatures_parallel: no
identifiers_parallel: no
verification_parallel: no

[tasks]
global_timeout_s: 1800
input_timeout_s: 5
create_timeout_s: 5
load_timeout_s: 600
signatures_timeout_s: 600
identifiers_timeout_s: 1200
summarize_timeout_s: 600
metadata_timeout_s: 600

[signatures]
enhanced_nucleic_acid_recognition: yes
overwrite_existing: no
generation_attempts: 5
smiles: yes
smiles_not_sanitized: no
smiles_maximum_number_of_atoms: 250
atom: yes
fasta_map_protein: yes
fasta_map_nucleic: yes
fasta_resname_protein: yes
fasta_resname_nucleic: yes
pdb_protein: yes
pdb_nucleic: yes
pdb_not_sanitized_protein: no
pdb_not_sanitized_nucleic: no
pdb_backbone_protein: yes
pdb_backbone_nucleic: yes
pdb_backbone_not_sanitized_protein: no
pdb_backbone_not_sanitized_nucleic: no
name_chain: yes
name_molecule: yes
name_segment: yes
fingerprint: yes
topology_less_pdb: yes
ca_only_pdb: yes
fasta_map_determine_sequence_partial_mode: no
fasta_map_determine_sequence_strict_mode: no
name_minimum_length: 1

[identifiers]
overwrite_existing: yes
blast_pdb_protein: yes
blast_pdb_protein_similarity: yes
blast_uniprot: yes
blast_uniprot_similarity: yes
blast_nr_protein: no
blast_nr_protein_similarity: no
blast_swissprot_protein: yes
blast_swissprot_protein_similarity: yes
blast_pdb_nucleic: yes
blast_pdb_nucleic_similarity: yes
blast_core_nt: no
blast_core_nt_similarity: no
blast_nt: no
blast_nt_similarity: no
pdb_struct_protein: no
pdb_struct_protein_similarity: no
pdb_struct_nucleotide: no
pdb_struct_nucleotide_similarity: no
alphafind_struct: no
alphafind_struct_similarity: no
chembl_struct: yes
chembl_struct_similarity: yes
formula_chembl: yes

[loader]
guess_missing_bonds: yes
unwrap_periodic_boundaries: yes
unwrap_compound: fragments
unwrap_reference: com
unwrap_selection: all
unwrap_guess_bonds_if_missing: yes
unwrap_warn_if_jumps_detected: yes
unwrap_max_bond_length_factor: 0.5
unwrap_max_backbone_gap: 10.0

[blast]
nr_aa_db =
swissprot_aa_db = /app/databases/swissprot/swissprot
pdb_aa_db = /app/databases/pdbaa/pdbaa
pdb_nt_db = /app/databases/pdbnt/pdbnt
core_nt_db =
nt_db =
blastp_num_threads = 2
blastn_num_threads = 2
max_target_seqs = 500
timeout_s = 600

[identifiers_cache]
directory:
file: resolver_cache.sqlite3

[verification]
verify_top_n: 100
verify_rerank_max_candidates: 60000
similarity_top_n: 10
enable_annotation_quality: yes
resolver_weight: 0.4
similarity_weight: 0.4
annotation_weight: 0.2
tm_score_threshold: 0.5
min_final_confidence: 0.0

[render]
export_mmcif: yes
export_pdb: no
export_summary: yes
pubchem_struct: no
pubchem_struct_similarity: no
formula_pubchem: no
formula_pubchem_similarity: no

[names]
ccd_db: /data/validation/databases/ccd.json
maps_db: /data/validation/databases/maps.json
manual_db: /data/validation/databases/manual.json
