worker_processes auto;
pid /tmp/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    keepalive_timeout 65;
    
    upstream validation-api {
        server validation-api:8000;
    }
    
    server {
        listen 80;
        server_name localhost;
        
        root /var/www/app;
        index index.html;
        
        # Static files - MUST be first
        location /static/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        
        # Favicon and manifest
        location = /favicon.ico { try_files $uri =404; }
        location = /favicon.png { try_files $uri =404; }
        location = /manifest.json { try_files $uri =404; }
        location = /asset-manifest.json { try_files $uri =404; }
        location = /robots.txt { try_files $uri =404; }
        
        # API proxy - strip /api prefix
        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://validation-api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        # Batch runs API - exact match and with ID
        location = /batch-runs { proxy_pass http://validation-api; proxy_set_header Host $host; }
        location ~ ^/batch-runs/[^/]+$ { proxy_pass http://validation-api; proxy_set_header Host $host; }
        
        # Validation API routes - exact matches first
        location = /validation/queue/status { proxy_pass http://validation-api; proxy_set_header Host $host; }
        location = /validation/queue/workers { proxy_pass http://validation-api; proxy_set_header Host $host; }
        location /validation/queue/list { proxy_pass http://validation-api; proxy_set_header Host $host; }
        location /validation/queue/bulk-action { proxy_pass http://validation-api; proxy_set_header Host $host; }
        location /validation/queue/start-processing { proxy_pass http://validation-api; proxy_set_header Host $host; }
        location /validation/queue/stop-processing { proxy_pass http://validation-api; proxy_set_header Host $host; }
        location /validation/queue/clear { proxy_pass http://validation-api; proxy_set_header Host $host; }
        
        location = /validation/workers/status { proxy_pass http://validation-api; proxy_set_header Host $host; }
        location /validation/workers/scale { proxy_pass http://validation-api; proxy_set_header Host $host; }
        location /validation/workers/metrics { proxy_pass http://validation-api; proxy_set_header Host $host; }
        location ~ /validation/workers/[^/]+/restart { proxy_pass http://validation-api; proxy_set_header Host $host; }
        
        location /validation/stats/ { proxy_pass http://validation-api; proxy_set_header Host $host; }
        location /validation/activity-log/ { proxy_pass http://validation-api; proxy_set_header Host $host; }
        
        # Direct API routes
        location = /stats { proxy_pass http://validation-api; proxy_set_header Host $host; }
        location = /stats/dashboard { proxy_pass http://validation-api; proxy_set_header Host $host; }
        location /runs { proxy_pass http://validation-api; proxy_set_header Host $host; }
        location /files { proxy_pass http://validation-api; proxy_set_header Host $host; }
        location /health { proxy_pass http://validation-api; proxy_set_header Host $host; }
        location /docs { proxy_pass http://validation-api; proxy_set_header Host $host; }
        location = /openapi.json { proxy_pass http://validation-api; proxy_set_header Host $host; }
        
        # SPA routing - React router pages (must be LAST)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
