site_name: BAT3 / BioID Validation
site_description: Molecular identification & validation pipeline for MD simulation data
docs_dir: .
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    primary: blue grey
plugins:
  - search
markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Running validations: running-a-validation.md
  - Architecture: architecture.md
  - API: api.md
  - Identification & verification: identifiers.md
  - Configuration: configuration.md
  - Methodology & statistics: methodology.md
  - Operations: operations.md
  - Developers: developers.md
