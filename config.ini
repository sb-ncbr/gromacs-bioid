[databases]
sync_enabled: no
sync_url: https://bioid.dyn.cloud.e-infra.cz:443

[executor]
; maximum number of threads for concurrent jobs
n_threads: 10
TPS: 100
emit_queue_stats: yes

[loader]
unwrap_periodic_boundaries: yes
unwrap_compound: fragments
unwrap_reference: com
unwrap_selection: all
unwrap_guess_bonds_if_missing: yes
unwrap_warn_if_jumps_detected: yes
unwrap_max_bond_length_factor: 0.5
unwrap_max_backbone_gap: 10.0



[tasks]
global_timeout_s: 600
input_timeout_s: 5
create_timeout_s: 5
load_timeout_s: 300
signatures_timeout_s: 2400
identifiers_timeout_s: 1200
summarize_timeout_s: 1200
metadata_timeout_s: 1200
; Parallelism feature toggles (default no for backward compatibility)
signatures_parallel: no
identifiers_parallel: no
verification_parallel: no

[signatures]
overwrite_existing: no
; MDAnalysis might bug non-deterministically, necessitating multiple attempts to generate the same signature
generation_attempts: 10

# settings for which signature generators are enabled
smiles: yes
smiles_not_sanitized: yes
# in order to prevent protein classification using SMILES, we limit the maximum number of atoms applicable for smiles
# signature
smiles_maximum_number_of_atoms: 250
atom: yes
fasta_map_protein: yes
fasta_map_nucleic: yes
fasta_resname_protein: yes
fasta_resname_nucleic: yes
# Enhanced nucleic acid recognition (wave-7): liberal resname patterns
# (D- deoxy prefix, [3|5] terminal codes such as DA3/RG5) plus a structural
# sugar-phosphate fallback guarded by a mandatory cross-residue
# phosphodiester bond (cofactors like CoA/ATP can never be misclassified).
# Set to "no" to restore pre-wave-7 classification behavior.
enhanced_nucleic_acid_recognition: yes
pdb_protein: yes
pdb_nucleic: yes
pdb_not_sanitized_protein: yes
pdb_not_sanitized_nucleic: yes
pdb_backbone_protein: yes
pdb_backbone_nucleic: yes
pdb_backbone_not_sanitized_protein: yes
pdb_backbone_not_sanitized_nucleic: yes
name_chain: yes
name_molecule: yes
name_segment: yes
fingerprint: yes
topology_less_pdb: yes
ca_only_pdb: yes

; in partial mode, protein sequence can be shorter than number of residues in the fragment
fasta_map_determine_sequence_partial_mode: no
; in strict mode, protein sequence must start with Methionine
fasta_map_determine_sequence_strict_mode: no

name_minimum_length: 1

[identifiers]
overwrite_existing: no
blast_pdb_protein: yes
blast_pdb_protein_similarity: yes
blast_uniprot: yes
blast_uniprot_similarity: yes
# NCBI nr / nt / core_nt: Deep search only (preset "deep", 2026-11-18). nr is
# 826 GB on NFS and finished 1 of 30 protein searches in a week at the 1 h limit.
blast_nr_protein: no
blast_nr_protein_similarity: no
blast_swissprot_protein: yes
blast_swissprot_protein_similarity: yes
blast_pdb_nucleic: yes
blast_pdb_nucleic_similarity: yes
blast_core_nt: no
blast_core_nt_similarity: no
blast_nt: no
blast_nt_similarity: no
pdb_struct_protein: yes
pdb_struct_protein_similarity: yes
pdb_struct_nucleotide: yes
pdb_struct_nucleotide_similarity: yes
alphafind_struct: yes
# TODO
alphafind_struct_similarity: yes
# TODO
chembl_struct: yes
chembl_struct_similarity: yes
pubchem_struct: yes
pubchem_struct_similarity: yes
atom: yes
atom_similarity: no
idsm_pubchem: yes
idsm_pubchem_similarity: yes
idsm_chembl: yes
idsm_chembl_similarity: yes
idsm_chebi: yes
idsm_chebi_similarity: yes
name_ccd: yes
name_ccd_similarity: no
# name_manual: off, its data (databases/manual.json) does not exist.
# name_maps: force-field residue and moleculetype names (CHARMM36, AMBER,
# GROMACS, Slipids: lipids, sterols, detergents, fatty acids, ions) to
# InChIKeys, src_new/identification/name_tables/ (2026-11-17). Candidates
# like any other name lookup: verified, never an override.
name_maps: yes
name_maps_similarity: no
name_manual: no
name_manual_similarity: no
# Supplementary databases (2026-11-09). Searched in a second pass after all
# of the above, on what is left of the identify budget; they only add
# candidates and corroboration (src_new/identification/supplementary.py).
# Each stays inactive while its data is missing. Off in code by default, so
# configs that do not name them (the MDDBR evaluation) are unaffected.
blast_uniref50: yes
blast_uniref50_similarity: yes
foldseek_pdb: no
foldseek_pdb_similarity: yes
swisslipids: yes
swisslipids_similarity: yes
chebi_local: yes
chebi_local_similarity: yes
# SIFTS: UniProt accessions of exactly matched PDB chains become UniProt
# candidates (corroborate) or are only recorded (xref).
sifts_uniprot: yes
sifts_mode: corroborate
# Slow NCBI databases run last (after every other search on every molecule,
# on what is left of the identify budget): at the long BLAST limit nr used up
# the whole budget and the searches after it never ran (run 2aad52dc).
deferred_resolvers: blast_nr_protein, blast_nt, blast_core_nt
# ... and skipped for a segment a first-pass search already matched exactly
# (>= 0.99 identity and coverage): they would only re-find the same sequence
# (run 1882f6b9: an hour of nr for a protein PDB 5EF9_A matched exactly).
skip_deferred_on_exact: yes

[identifiers_cache]
# empty: workers use BAT3_IDENTIFIERS_CACHE_DIR (pod-local), else a tmp
# fallback. Never a shared network volume: SQLite WAL is unsupported on NFS.
directory:
file: resolver_cache.sqlite3
# TODO: cache.sqlite3 ./cli/BAT2/cache.sqlite3

[names]
ccd_db: databases/ccd.json
# TODO: databases/ccd.json ./cli/BAT2/databases/ccd.json
maps_db: src_new/identification/name_tables/maps.json
# TODO: databases/maps.json ./cli/BAT2/databases/maps.json
manual_db: databases/manual.json
# TODO: databases/manual.json ./cli/BAT2/databases/manual.json

[blast]
nr_aa_db: /app/databases/nr/nr
swissprot_aa_db: /app/databases/swissprot/swissprot
pdb_aa_db: /app/databases/pdbaa/pdbaa
pdb_nt_db: /app/databases/pdbnt/pdbnt
core_nt_db: /app/databases/core_nt/core_nt
nt_db: /app/databases/nt/nt

blastp_exec: /usr/bin/blastp
blastn_exec: /usr/bin/blastn
# Per-search time limit (s) for every BLAST database except nr / nt / core_nt
# (ncbi_timeout_s below) and UniRef50. UI runs only: the validation config
# (config_shared.ini) sets its own value. Each call is also clipped to the
# identify stage budget (VALIDATION_STAGE_BUDGETS on the UI worker).
timeout_s: 3600
# nr / nt / core_nt only (Deep search): one search reads up to 397 GB from the
# shared NFS volume (~50 MB/s for all pods together). The run's identify budget
# and wall-clock limit grow by this much when one of them is on.
ncbi_timeout_s: 43200
# Two BLAST threads per search: a UI worker pod has 4 CPUs for 2 runs.
blastp_num_threads: 2
blastn_num_threads: 2
# UniRef50 (blast_uniref50): own threads and per-search limit.
uniref50_aa_db: /app/databases/uniref50/uniref50
uniref50_num_threads: 4
uniref50_timeout_s: 900
# BLAST services with an NVMe copy of one database (deploy/bioid-blast-<db>.yaml,
# src_new/blast_service.py). A search goes to the service when it is ready
# with the same database release and BLAST version, otherwise it runs on NFS
# as before; a service that does not exist costs one failed lookup per run.
nr_service_url: http://bioid-blast-nr:8080
nt_service_url: http://bioid-blast-nt:8080
core_nt_service_url: http://bioid-blast-core-nt:8080
uniref50_service_url: http://bioid-blast-uniref50:8080
# optimize BLAST search for short sequences if query is shorter than X nucleotides
local_instance_run_short_search_if_under_X_residues: 30

# BLAST requirements for exact matches (identity identification)
exact_match_max_evalue: 1e-50
exact_match_min_bits: 51
exact_match_min_identity_p: 0.99
exact_match_min_query_cov_p: 0.99

# BLAST requirements for similarity matches (similarity-based identification)
similarity_match_max_evalue: 0.1
similarity_match_min_bits: 20
similarity_match_min_identity_p: 0.4
similarity_match_min_query_cov_p: 0.15

[chembl]
# minimum percentage similarity for CHEMBL similarity search
similarity_threshold: 60

[idsm]
# minimum percentage similarity for IDSM similarity search
similarity_threshold: 80

[pubchem]
# minimum percentage similarity for PUBCHEM similarity search
similarity_threshold: 95
; pubchem is prone to rejecting attempts for search when service gets busy
retry_attempts: 1
retry_delay_s: 10

[PDB]
# if deployment file access is enabled, it is expected that no uploads are necessary and file accessible through API
# otherwise, ssh upload is necessary
# NOTE: if set to yes, you are responsible for making sure the file is available (observe temporary directory settings,
#        it makes sense only if temporary directories are disabled)
use_deployment_file_access: yes
# TODO: yes
deployment_file_url: https://bioid.dyn.cloud.e-infra.cz

# queries to RCSB PDB structure search need to be uploaded to online server from which they can be referenced by URL
# following, two commands (upload and delete) are defined, each part of a command on a separate line
[PDB_UPLOAD_UPLOAD_COMMAND]
0 = scp
1 = {FILEPATH}
2 = xpavlik8@aisa.fi.muni.cz:/home/xpavlik8/public_html/{FILENAME}
# requires {FILEPATH} (path to source local file) and {FILENAME} {name of the file on remote}

[PDB_UPLOAD_DELETE_COMMAND]
0 = ssh
1 = xpavlik8@aisa.fi.muni.cz
2 = rm /home/xpavlik8/public_html/{FILENAME}
# requires {FILENAME} {name of the file on remote}

# finally, upon successful upload, the .PDB file must be available by public URL link
[PDB_UPLOAD_URL]
url: https://www.fi.muni.cz/~xpavlik8/{FILENAME}
# requires {FILENAME} {name of the file on remote}

[ALPHAFIND]
url = https://api.stage.alphafind.dyn.cloud.e-infra.cz/search?limit=50&offset=0&superposition=true
retry_count = 2
retry_delay_s = 5
request_timeout_s = 30
poll_interval_s = 5
max_poll_attempts = 20

[foldseek]
; v3.138: local subprocess vs the Swiss-Prot AFDB copy on the shared PVC
; (populated by the one-shot bootstrap Job); falls back to the public
; foldseek REST server when local execution/DB is unavailable.
; mode = local | remote | off
mode = local
db_path = /app/databases/foldseek/swissprot
remote_url = https://search.foldseek.com/api
remote_database = afdb-swissprot
; local PDB database for foldseek_pdb (local only, no remote fallback)
pdb_db_path = /app/databases/foldseek/pdb
remote_polls = 12
; local search: prefilter_mode 1 = ungapped (seconds on Swiss-Prot; the k-mer
; default 0 rebuilds an index per query and took ~450 s); 2 threads per search
prefilter_mode = 1
threads = 2


[miscellaneous]
# temporary directory: if usage is disabled, the current simulation directory will be used
use_temporary_directory: no
temporary_directory: tmp
uid_length: 10

[verification]
verify_top_n: 100
# groups the second identify pass (supplementary databases, deferred nr/nt)
# contributed beyond the regular window, verified after it
verify_top_n_supplementary: 40
similarity_top_n: 10
enable_annotation_quality: yes
resolver_weight: 0.4
similarity_weight: 0.4
annotation_weight: 0.2
tm_score_threshold: 0.5
min_final_confidence: 0.0