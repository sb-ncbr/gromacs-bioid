apiVersion: batch/v1
kind: Job
metadata:
  name: bat3-pubchem-mirror-build
  labels:
    app: bat3-pubchem-mirror-build
spec:
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 86400
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: bat3-pubchem-mirror-build
    spec:
      restartPolicy: OnFailure
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pubchem-mirror-build
          # b20 = f4364d4d7 (annotation extras dd694dd4e, M1 validation probes,
          # M3 hung-batch isolation, M5 isolation probes in their own pool)
          image: "cerit.io/tomsko/bat3-validation-api@sha256:08837dc16a43125d478d606228a04f70111b650f76d5b7afb16b3404e5b98d8e"
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /app/scripts/populate_pubchem_mirror.py
            - --target-dir
            - /app/databases/pubchem
            # build + validate only; workers read current/ live, so activation
            # is a separate gated --activate-only run between campaigns
            - --defer-activate
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "8"
              memory: 32Gi
          volumeMounts:
            - name: databases-data
              mountPath: /app/databases
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: databases-data
          persistentVolumeClaim:
            claimName: bat3-databases-data-ceitec
