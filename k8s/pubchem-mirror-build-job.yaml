apiVersion: batch/v1
kind: Job
metadata:
  name: bat3-pubchem-mirror-build
  labels:
    app: bat3-pubchem-mirror-build
spec:
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 86400
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: bat3-pubchem-mirror-build
    spec:
      restartPolicy: OnFailure
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pubchem-mirror-build
          # b16 = f1012ce1c (dd694dd4e annotation extras + M1 validation probes)
          image: "cerit.io/tomsko/bat3-validation-api@sha256:7a090106365f874b9a495c4b98a08cc8b44863f995d39a525202da066b6f847e"
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /app/scripts/populate_pubchem_mirror.py
            - --target-dir
            - /app/databases/pubchem
            # build + validate only; workers read current/ live, so activation
            # is a separate gated --activate-only run between campaigns
            - --defer-activate
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "8"
              memory: 32Gi
          volumeMounts:
            - name: databases-data
              mountPath: /app/databases
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: databases-data
          persistentVolumeClaim:
            claimName: bat3-databases-data-ceitec
