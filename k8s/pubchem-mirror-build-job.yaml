apiVersion: batch/v1
kind: Job
metadata:
  name: bat3-pubchem-mirror-build
  labels:
    app: bat3-pubchem-mirror-build
spec:
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 86400
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: bat3-pubchem-mirror-build
    spec:
      restartPolicy: OnFailure
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pubchem-mirror-build
          image: "cerit.io/tomsko/bat3-worker:v2.38"
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /app/scripts/populate_pubchem_mirror.py
            - --target-dir
            - /app/databases/pubchem
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "8"
              memory: 32Gi
          volumeMounts:
            - name: databases-data
              mountPath: /app/databases
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: databases-data
          persistentVolumeClaim:
            claimName: bat3-databases-data-ceitec
