server {
    listen 8081;
    server_name localhost;

    root /var/www/app;
    index index.html;

    # SPA fallback (deep links like /runs/<id> are client routes).
    # The HTML shell must be revalidated on every load: without Cache-Control
    # browsers cache it heuristically (a fraction of its age), keep pointing
    # at the previous build's hashed bundle and miss a deploy for hours
    # (w22, 2026-11-06: Firefox kept loading index-CxqTC9Nv.js after rollout).
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Content-hashed build assets never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Versioned API
    location /api {
        proxy_pass http://bat3-ceitec-bat3-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_intercept_errors off;
    }

    # Static run files served by API container
    location /files {
        proxy_pass http://bat3-ceitec-bat3-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_intercept_errors off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
