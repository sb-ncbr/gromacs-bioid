# Repository-queue workers (2026-11-18): the same image and settings as
# bat3-ui-worker, consuming validation.repo.celery (campaigns such as mdval,
# submitted with queue=repository and an X-Queue-Token). Starts at 0
# replicas; the campaign scales it (kubectl scale or the admin page).
# deploy/release.sh updates its image with the other workers.
#   kubectl -n ceitec-biodata-ns apply -f deploy/bat3-repo-worker.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations: {}
  labels:
    app: bat3-repo-worker
  name: bat3-repo-worker
  namespace: ceitec-biodata-ns
spec:
  progressDeadlineSeconds: 600
  replicas: 0
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: bat3-repo-worker
  strategy:
    type: Recreate
  template:
    metadata:
      annotations: {}
      labels:
        app: bat3-repo-worker
    spec:
      containers:
      - command:
        - celery
        - -A
        - src_new.celery_app
        - worker
        - --loglevel=info
        - --pool=threads
        - --concurrency=2
        - -Q
        - validation.repo.celery
        env:
        - name: CELERY_BROKER_URL
          value: redis://bat3-redis.ceitec-biodata-ns.svc.cluster.local:6379/0
        - name: CELERY_RESULT_BACKEND
          value: redis://bat3-redis.ceitec-biodata-ns.svc.cluster.local:6379/0
        - name: BAT3_RUNS_DIR
          value: /app/runs
        - name: CLEANUP_DAYS
          value: '30'
        - name: TZ
          value: Europe/Prague
        - name: VALIDATION_SKIP_PUG
          value: '1'
        - name: SPIN_DEBUG
          value: '1'
        - name: DEPLOYMENT_FILE_URL
          value: https://bioid-ceitec.dyn.cloud.e-infra.cz
        - name: BLASTDB_MEM_MAP
          value: '0'
        - name: BAT3_CODE_VERSION
          value: git-c3fafa592
        - name: BAT3_ADHOC_DIR
          value: /app/runs/_adhoc
        - name: BAT3_IDENTIFIERS_CACHE_DIR
          value: /app/cache
        - name: VALIDATION_STAGE_BUDGETS
          value: '{"identify_molecules": 4500}'
        - name: NCBI_API_KEY
          valueFrom:
            secretKeyRef:
              key: NCBI_API_KEY
              name: bioid-api-secrets
        - name: BAT3_SHARED_CACHE_URL
          value: redis://bioid-cache-redis:6379/0
        - name: BAT3_RENDER_DISABLE
          value: '1'
        image: cerit.io/tomsko/bat3-validation-api@sha256:18ad70344a0399d71e1e56e7bdaf29d0ae9f464d552d896c612c08523b6484ab
        imagePullPolicy: Always
        name: repo-worker
        resources:
          limits:
            cpu: '4'
            memory: 10Gi
          requests:
            cpu: '2'
            memory: 6Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app/runs
          name: runs-data
        - mountPath: /app/databases
          name: databases-data
        - mountPath: /data/validation
          name: validation-data
        - mountPath: /app/cache
          name: resolver-cache
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # 2026-11-23: a shutting-down worker stops its pipelines and re-queues
      # their runs under the same run id (src_new/api/tasks.py), ~20 s at most
      terminationGracePeriodSeconds: 60
      volumes:
      - name: runs-data
        persistentVolumeClaim:
          claimName: bat3-runs-data-ceitec
      - name: databases-data
        persistentVolumeClaim:
          claimName: bat3-databases-data-ceitec
      - name: validation-data
        persistentVolumeClaim:
          claimName: validation-data-ceitec
      - emptyDir:
          sizeLimit: 2Gi
        name: resolver-cache
