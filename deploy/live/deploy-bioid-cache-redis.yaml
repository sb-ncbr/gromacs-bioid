# Exported from ceitec-biodata-ns by deploy/export-live.sh; do not edit by hand
# without applying the same change to the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations: {}
  labels:
    app: bioid-cache-redis
  name: bioid-cache-redis
  namespace: ceitec-biodata-ns
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: bioid-cache-redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: bioid-cache-redis
    spec:
      containers:
      - args:
        - redis-server
        - --maxmemory
        - 40gb
        - --maxmemory-policy
        - volatile-lru
        - --dir
        - /data
        - --save
        - 3600 1
        - --appendonly
        - 'no'
        - --timeout
        - '0'
        image: redis:8-alpine
        imagePullPolicy: IfNotPresent
        name: redis
        ports:
        - containerPort: 6379
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          failureThreshold: 3
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: '2'
            memory: 48Gi
          requests:
            cpu: 250m
            memory: 24Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: data
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 999
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
      terminationGracePeriodSeconds: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: bioid-cache-redis-data-64g
