# Exported from ceitec-biodata-ns by deploy/export-live.sh; do not edit by hand
# without applying the same change to the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    field.cattle.io/publicEndpoints: '[{"addresses":[""],"port":443,"protocol":"HTTPS","serviceName":"ceitec-biodata-ns:bioid-mcp","ingressName":"ceitec-biodata-ns:bioid-mcp","hostname":"bioid-ceitec.dyn.cloud.e-infra.cz","path":"/mcp","allNodes":false}]'
  labels:
    app: bioid-mcp
  name: bioid-mcp
  namespace: ceitec-biodata-ns
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: bioid-mcp
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: bioid-mcp
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: BIOID_API_URL
          value: http://bat3-ceitec-bat3-api:8000
        - name: BIOID_PUBLIC_URL
          value: https://bioid-ceitec.dyn.cloud.e-infra.cz
        - name: BIOID_MCP_MAX_UPLOAD_MB
          value: '50'
        image: cerit.io/tomsko/bioid-mcp:0.2.5
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 1
        name: mcp
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 2
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 20m
            memory: 96Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir:
          sizeLimit: 64Mi
        name: tmp
