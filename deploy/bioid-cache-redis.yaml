# Shared resolver cache (src_new/identification/shared_cache.py), 2026-11-17.
#
# Cache only: separate from the Celery broker (bat3-redis) so a full cache
# can never evict the job queue. Workers and the API find it through
# BAT3_SHARED_CACHE_URL=redis://bioid-cache-redis:6379/0; without that env
# the layer is off. Holds the shared resolver answers (30-day expiry), the
# service measurements (48 h) and, since 2026-11-18, annotation scores with
# NO expiry (kept until we decide on one). So:
# - volatile-lru: under memory pressure only keys WITH an expiry are evicted;
# - snapshot to the bioid-cache-redis-data volume hourly (and on shutdown),
#   loaded again on start, so a restart keeps the cache;
# - memory limit about 2x maxmemory: the snapshot forks the server.
#
#   kubectl -n ceitec-biodata-ns apply -f deploy/bioid-cache-redis.yaml
#   kubectl -n ceitec-biodata-ns set env deploy/bat3-ui-worker deploy/bat3-ceitec-bat3-worker \
#       BAT3_SHARED_CACHE_URL=redis://bioid-cache-redis:6379/0
# Off again: kubectl ... set env deploy/... BAT3_SHARED_CACHE_URL-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bioid-cache-redis
  labels: {app: bioid-cache-redis}
spec:
  replicas: 1
  strategy: {type: Recreate}  # one server per snapshot file
  selector:
    matchLabels: {app: bioid-cache-redis}
  template:
    metadata:
      labels: {app: bioid-cache-redis}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:8-alpine
          args: ["redis-server", "--maxmemory", "1536mb", "--maxmemory-policy", "volatile-lru",
                 "--dir", "/data", "--save", "3600 1", "--appendonly", "no", "--timeout", "0"]
          ports:
            - containerPort: 6379
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 3Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: data, mountPath: /data}
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: bioid-cache-redis-data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bioid-cache-redis-data
  labels: {app: bioid-cache-redis}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-csi
  resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: bioid-cache-redis
  labels: {app: bioid-cache-redis}
spec:
  selector: {app: bioid-cache-redis}
  ports:
    - port: 6379
      targetPort: 6379
