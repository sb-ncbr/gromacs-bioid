apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: bat3-ui-worker
  name: bat3-ui-worker
  namespace: ceitec-biodata-ns
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  selector:
    matchLabels:
      app: bat3-ui-worker
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-08-07T10:49:51+02:00'
      labels:
        app: bat3-ui-worker
    spec:
      containers:
      - command:
        - celery
        - -A
        - src_new.celery_app
        - worker
        - --loglevel=info
        - --pool=threads
        - --concurrency=2
        - -Q
        - validation.ui.celery
        env:
        - name: CELERY_BROKER_URL
          value: redis://bat3-redis.ceitec-biodata-ns.svc.cluster.local:6379/0
        - name: CELERY_RESULT_BACKEND
          value: redis://bat3-redis.ceitec-biodata-ns.svc.cluster.local:6379/0
        - name: BAT3_RUNS_DIR
          value: /app/runs
        - name: CLEANUP_DAYS
          value: '30'
        - name: TZ
          value: Europe/Prague
        image: cerit.io/tomsko/bat3-worker:v2.25
        imagePullPolicy: Always
        name: ui-worker
        resources:
          limits:
            cpu: '4'
            memory: 10Gi
          requests:
            cpu: '2'
            memory: 6Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app/runs
          name: runs-data
        - mountPath: /app/databases
          name: databases-data
        - mountPath: /data/validation
          name: validation-data
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - name: runs-data
        persistentVolumeClaim:
          claimName: bat3-runs-data-ceitec
      - name: databases-data
        persistentVolumeClaim:
          claimName: bat3-databases-data-ceitec
      - name: validation-data
        persistentVolumeClaim:
          claimName: validation-data-ceitec
