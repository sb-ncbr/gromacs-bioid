# BLAST service with a node-local NVMe copy of one database (2026-11-19),
# src_new/blast_service.py. Workers send searches here when it is ready with
# the same release and BLAST version as their NFS copy
# ([blast] *_service_url in config.ini); otherwise they search NFS as before.
# nr: 887 GB of files, ZFS stores them in ~600 GB; copy ~6 h at 40 MB/s.
# Pilot 2026-11-18: 5-13.5 min per protein at 8 threads (NFS: 2.2 h or more).
#
# zfs-csi is node-local: the volume (and so the pod) stays on the node it was
# first created on. Stop: kubectl scale --replicas=0 (the copy stays on the
# volume; the next start is ready at once). Delete the PVC to free the disk.
# NOT updated by deploy/release.sh: a restart would send in-flight searches back
# to NFS. Update the image here when blast_service.py changes, between searches.
#   kubectl -n ceitec-biodata-ns apply -f deploy/bioid-blast-nr.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bioid-blast-nr-nvme
  namespace: ceitec-biodata-ns
  labels: {app: bioid-blast-nr}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: zfs-csi
  resources: {requests: {storage: 900Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bioid-blast-nr
  namespace: ceitec-biodata-ns
  labels: {app: bioid-blast-nr}
spec:
  replicas: 1
  strategy: {type: Recreate}  # one pod per volume
  selector:
    matchLabels: {app: bioid-blast-nr}
  template:
    metadata:
      labels: {app: bioid-blast-nr}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: blast
          image: cerit.io/tomsko/bat3-validation-api@sha256:5a38eaa2ceca4e266bd3c67b8e468c3d12f1da15f3985a6daa386f0c04046d54
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["python", "-m", "src_new.blast_service"]
          env:
            - {name: BLAST_DB_PATH, value: /app/databases/nr/nr}
            - {name: BLAST_LOCAL_DIR, value: /nvme}
            - {name: BLAST_THREADS, value: "8"}
            - {name: BLAST_SLOTS, value: "1"}
            - {name: BLAST_STAGE_MBPS, value: "40"}
            # NCBI database update 2026-11-19: download this AWS snapshot instead of
            # copying NFS; served once the NFS symlink is switched to it
            # (deploy/blastdb-update.yaml downloads the NFS copy in parallel).
            - {name: BLAST_FETCH_SNAPSHOT, value: "2026-10-22-01-05-01"}
            - {name: BLASTDB_MEM_MAP, value: "0"}  # as on the workers
            - {name: TZ, value: Europe/Prague}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: "4", memory: 8Gi}
            limits: {cpu: "8", memory: 16Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: databases, mountPath: /app/databases, readOnly: true}
            - {name: nvme, mountPath: /nvme}
      volumes:
        - name: databases
          persistentVolumeClaim: {claimName: bat3-databases-data-ceitec, readOnly: true}
        - name: nvme
          persistentVolumeClaim: {claimName: bioid-blast-nr-nvme}
---
apiVersion: v1
kind: Service
metadata:
  name: bioid-blast-nr
  namespace: ceitec-biodata-ns
  labels: {app: bioid-blast-nr}
spec:
  selector: {app: bioid-blast-nr}
  ports:
    - port: 8080
      targetPort: 8080
