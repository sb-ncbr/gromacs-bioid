apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bat3.fullname" . }}-worker
spec:
  replicas: {{ .Values.replicaCount.worker }}
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: {{ include "bat3.fullname" . }}-worker
  template:
    metadata:
      labels:
        app: {{ include "bat3.fullname" . }}-worker
    spec:
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: "{{ .Values.image.worker.repository }}:{{ .Values.image.worker.tag }}"
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          env:
            - name: CELERY_BROKER_URL
              value: {{ .Values.celery.brokerUrl | default (printf "redis://%s-redis:%v/0" (include "bat3.fullname" .) (.Values.redis.port | default 6379)) }}
            - name: CELERY_RESULT_BACKEND
              value: {{ .Values.celery.resultBackend | default (printf "redis://%s-redis:%v/0" (include "bat3.fullname" .) (.Values.redis.port | default 6379)) }}
            - name: BAT3_RUNS_DIR
              value: "{{ .Values.dataFolder }}"
            - name: CLEANUP_DAYS
              value: "{{ .Values.cleanupDays }}"
            - name: TZ
              value: "{{ .Values.timezone }}"
          resources:
            requests:
              cpu: {{ .Values.resources.worker.requests.cpu }}
              memory: {{ .Values.resources.worker.requests.memory }}
            limits:
              cpu: {{ .Values.resources.worker.limits.cpu }}
              memory: {{ .Values.resources.worker.limits.memory }}
          volumeMounts:
            - name: runs-data
              mountPath: {{ .Values.dataFolder }}
            - name: databases-data
              mountPath: {{ .Values.databasesFolder }}
            - name: validation-data
              mountPath: /data/validation
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: runs-data
          persistentVolumeClaim:
            claimName: {{ .Values.storage.runsData.existingClaim | default (printf "%s-runs-data" (include "bat3.fullname" .)) }}
        - name: databases-data
          persistentVolumeClaim:
            claimName: {{ .Values.storage.databasesData.existingClaim | default (printf "%s-databases-data" (include "bat3.fullname" .)) }}
        - name: validation-data
          persistentVolumeClaim:
            claimName: validation-data-ceitec
