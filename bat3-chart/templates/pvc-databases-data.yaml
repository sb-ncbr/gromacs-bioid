{{- if not .Values.storage.databasesData.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "bat3.fullname" . }}-databases-data
spec:
  accessModes:
    - {{ .Values.storage.databasesData.accessMode | default "ReadWriteMany" }}
  resources:
    requests:
      storage: {{ .Values.storage.databasesData.size }}
  {{- if .Values.storage.databasesData.storageClass }}
  storageClassName: {{ .Values.storage.databasesData.storageClass }}
  {{- end }}
{{- end }}
